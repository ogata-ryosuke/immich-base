# immich 本体構成。
# 画像タグは .env で管理する。アップグレード時は必ず公式 release notes を確認し、
# 公式 docker-compose.yml と DB/redis イメージのタグを突き合わせること。
# 参照: https://github.com/immich-app/immich/releases/latest (docker-compose.yml, example.env)

name: immich

services:
  immich-server:
    container_name: immich_server
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:-release}
    # GPUトランスコードを使う場合は docs/04-gpu-accel.md 参照
    # extends:
    #   file: hwaccel.transcoding.yml
    #   service: nvenc
    volumes:
      # 新規アップロード（スマホバックアップ等）。RAID 上でも可（DBほど致命的でない）
      - ${UPLOAD_LOCATION}:/usr/src/app/upload
      # 既存写真の外部ライブラリ（読み取り専用でマウント）
      # EXTERNAL_LIBRARY が未設定/空でも落ちないよう、ダミーフォルダを既定にしている。
      # 既存写真を使うときは .env の EXTERNAL_LIBRARY に実フォルダ（例 E:/Photos）を指定する。
      - ${EXTERNAL_LIBRARY:-./external-placeholder}:/mnt/external:ro
      - /etc/localtime:/etc/localtime:ro
    env_file:
      - .env
    ports:
      - '2283:2283'
    depends_on:
      - redis
      - database
    restart: always
    healthcheck:
      disable: false

  immich-machine-learning:
    container_name: immich_machine_learning
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION:-release}
    # GPU(CUDA)でML高速化する場合は docs/04-gpu-accel.md 参照
    # extends:
    #   file: hwaccel.ml.yml
    #   service: cuda
    volumes:
      - model-cache:/cache
    env_file:
      - .env
    restart: always
    healthcheck:
      disable: false

  redis:
    container_name: immich_redis
    # タグは公式 example.env / compose と一致させること
    image: ${REDIS_IMAGE:-docker.io/valkey/valkey:8-bookworm}
    healthcheck:
      test: redis-cli ping || exit 1
    restart: always

  database:
    container_name: immich_postgres
    # ★ immich 専用の Postgres イメージ。通常の postgres では動かない。
    #   タグは公式 example.env の DB_IMAGE と必ず一致させること。
    image: ${DB_IMAGE:-ghcr.io/immich-app/postgres:14-vectorchord0.3.0-pgvectors0.2.0}
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_DB: ${DB_DATABASE_NAME}
      POSTGRES_INITDB_ARGS: '--data-checksums'
    volumes:
      # ★ 内蔵SSDの安定したパスに置くこと（.env の DB_DATA_LOCATION）
      - ${DB_DATA_LOCATION}:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: >-
        pg_isready --dbname="$${POSTGRES_DB}" --username="$${POSTGRES_USER}" || exit 1
      interval: 5m
      start_interval: 30s
      start_period: 5m

volumes:
  model-cache:
